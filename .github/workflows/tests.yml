name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The project builds with uv_build and ships a uv.lock, so uv installs
      # the exact locked versions rather than re-resolving.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3.12 per requires-python = ">=3.12".
      - name: Set up Python
        run: uv python install 3.12

      # pytrec-eval 0.5 has no wheels and builds trec_eval 9.0.8 from vendored
      # C. That code predates C99 strictness, and GCC 14 (on ubuntu-latest)
      # promoted -Wincompatible-pointer-types and conflicting-types to hard
      # errors by default, so the build fails with:
      #   form_prefs_counts.c:818: error: passing argument 4 of 'qsort' from
      #   incompatible pointer type [-Wincompatible-pointer-types]
      # Compiling it as gnu17 with those two demoted back to warnings restores
      # the pre-GCC-14 behaviour. This affects only this dependency's C build.
      - name: Install
        env:
          CFLAGS: -std=gnu17 -Wno-incompatible-pointer-types -Wno-error=incompatible-pointer-types
        run: uv sync --locked --all-extras

      # No network and no SEC downloads: the tests inject fake encoders rather
      # than fetching models, and the ones that need a populated data/raw/ or
      # the Hugging Face cache skip themselves (tests/test_dense.py:378,
      # tests/test_section_extraction.py:748-771). Nothing needed marking.
      - name: Run tests
        run: uv run pytest -q
