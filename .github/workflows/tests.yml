name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Every test runs offline. The model cache is seeded by the tests
      # themselves through `CachedClient.record`, so a test that tried to
      # reach the API would raise `OfflineCacheMiss` rather than spend money
      # or depend on the network. These two make the same true of the
      # Hugging Face hub: the dense-encoder tests skip when the model is not
      # cached instead of downloading 440 MB on every run.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # The EDGAR identity is required by `ticker.download.ensure_identity`.
      # No test makes a request, but a module-level import that checked it
      # would otherwise fail the run for the wrong reason.
      EDGAR_IDENTITY: "CI runner ci@example.invalid"
      # Deliberately not set: ANTHROPIC_API_KEY. CI has no credential, which
      # is what makes "the suite makes no paid call" a property of the
      # environment rather than a promise about the code.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run the test suite
        run: uv run pytest -q -rs

      - name: Confirm no API key reached the environment
        # A key leaking into CI would mean the "offline" guarantee above was
        # never actually tested, so fail loudly rather than pass quietly.
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY is set in CI; the offline guarantee is untested." >&2
            exit 1
          fi
          echo "no API key present, as expected"

  frozen-questions:
    # The question set is the input every reported number is keyed to. This
    # job checks the file on disk still parses, still has the intended
    # composition, and still hashes to what the results claim. It cannot
    # re-derive the gold sets, because that needs the 900 MB corpus, so the
    # full `ticker eval build-questions --verify` is a local step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Check the frozen question set
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from ticker.cited.questions import (
              freeze_hash, load_questions, validate_composition, composition,
          )

          path = Path("eval/questions.jsonl")
          questions = load_questions(path)
          validate_composition(questions)
          digest = freeze_hash(path)
          print(f"{len(questions)} questions, composition {composition(questions)}")
          print(f"sha256 {digest}")

          recorded = Path("results/cited_answers/retrieval_ceiling.json")
          if recorded.exists():
              claimed = json.loads(recorded.read_text())["questions_sha256"]
              if claimed != digest:
                  raise SystemExit(
                      f"results claim question set {claimed[:16]} but the file "
                      f"hashes to {digest[:16]}; a reported number no longer "
                      "matches its inputs"
                  )
              print("recorded results match the frozen question set")
          PY
